name: lobster-build

on:
  push:
    branches: ["lobster/main", "ci/**"]
    tags: ["lobster-v*"]
  workflow_dispatch:

concurrency:
  group: lobster-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGURE_COMMON: --target-list=aarch64-softmmu --disable-docs --enable-tools

jobs:
  linux:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-x86_64, runner: ubuntu-24.04, arch: x86_64}
          - {id: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 python3-venv \
            python3-pip libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev libgtk-3-dev libsdl2-dev libcap-ng-dev libattr1-dev \
            patchelf ccache curl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.id }}-
      - name: Configure
        run: |
          mkdir build && cd build
          ../configure $CONFIGURE_COMMON --enable-gtk --enable-sdl \
            --enable-slirp --enable-vnc
      - name: Build
        run: |
          start=$(date +%s)
          ninja -C build qemu-system-aarch64 qemu-img
          echo "build time: $(( $(date +%s) - start ))s"
          ccache -s
      - name: Smoke test (build tree)
        run: .github/scripts/smoke.sh build "$RUNNER_TEMP/smoke-build"
      - name: Package
        run: |
          .github/scripts/package-linux.sh build . "dist/lobster-qemu-${{ matrix.id }}" "${{ matrix.id }}"
          tar -C dist -czf "lobster-qemu-${{ matrix.id }}.tar.gz" "lobster-qemu-${{ matrix.id }}"
          ls -l lobster-qemu-*.tar.gz
      - name: Self-contained check (extracted archive, clean env)
        run: |
          mkdir "$RUNNER_TEMP/extract"
          tar -C "$RUNNER_TEMP/extract" -xzf "lobster-qemu-${{ matrix.id }}.tar.gz"
          d="$RUNNER_TEMP/extract/lobster-qemu-${{ matrix.id }}"
          echo "--- ldd (libs resolved outside the package):"
          ldd "$d/bin/qemu-system-aarch64" | grep -v "$d" || true
          env -i PATH=/usr/bin:/bin BOOT_TIMEOUT=240 \
            .github/scripts/smoke.sh "$d/bin" "$RUNNER_TEMP/smoke-pkg"
      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/smoke-*/serial.log
            ${{ runner.temp }}/smoke-*/qemu.stderr
      - uses: actions/upload-artifact@v4
        with:
          name: lobster-qemu-${{ matrix.id }}
          path: lobster-qemu-${{ matrix.id }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install glib pixman sdl2 libslirp dtc ninja meson pkg-config ccache
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: ccache-macos-arm64-
      - name: Configure
        run: |
          mkdir build && cd build
          ../configure $CONFIGURE_COMMON --enable-cocoa --enable-sdl \
            --enable-slirp --disable-werror
      - name: Build
        run: |
          start=$(date +%s)
          ninja -C build qemu-system-aarch64 qemu-img
          echo "build time: $(( $(date +%s) - start ))s"
      - name: Smoke test (build tree)
        run: .github/scripts/smoke.sh build "$RUNNER_TEMP/smoke-build"
      - name: Package
        run: |
          .github/scripts/package-macos.sh build . dist/lobster-qemu-macos-arm64 macos-arm64
          tar -C dist -czf lobster-qemu-macos-arm64.tar.gz lobster-qemu-macos-arm64
          ls -l lobster-qemu-macos-arm64.tar.gz
      - name: Self-contained check (extracted archive)
        run: |
          mkdir "$RUNNER_TEMP/extract"
          tar -C "$RUNNER_TEMP/extract" -xzf lobster-qemu-macos-arm64.tar.gz
          d="$RUNNER_TEMP/extract/lobster-qemu-macos-arm64"
          for f in "$d"/bin/* "$d"/lib/*; do
            bad=$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | grep -vE '^(@rpath/|@loader_path/|@executable_path/|/usr/lib/|/System/)' || true)
            if [ -n "$bad" ]; then echo "non-portable refs in $f:"; echo "$bad"; exit 1; fi
          done
          echo "otool: only @rpath/system references"
          codesign --verify --verbose "$d/bin/qemu-system-aarch64"
          # brew prefix removed from PATH for the run
          env -i PATH=/usr/bin:/bin BOOT_TIMEOUT=240 \
            .github/scripts/smoke.sh "$d/bin" "$RUNNER_TEMP/smoke-pkg"
      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-macos-arm64
          path: |
            ${{ runner.temp }}/smoke-*/serial.log
            ${{ runner.temp }}/smoke-*/qemu.stderr
      - uses: actions/upload-artifact@v4
        with:
          name: lobster-qemu-macos-arm64
          path: lobster-qemu-macos-arm64.tar.gz
          retention-days: 14
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git diffutils make
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-zlib
      - name: Configure and build
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          ../configure $CONFIGURE_COMMON --enable-sdl --enable-slirp \
            --enable-fdt=internal --disable-gtk --disable-werror
          start=$(date +%s)
          ninja qemu-system-aarch64.exe qemu-img.exe
          echo "build time: $(( $(date +%s) - start ))s"
      - name: Package
        shell: msys2 {0}
        run: .github/scripts/package-windows.sh build . dist/lobster-qemu-windows-x86_64 windows-x86_64
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/lobster-qemu-windows-x86_64 -DestinationPath lobster-qemu-windows-x86_64.zip
          Get-Item lobster-qemu-windows-x86_64.zip | Format-List Name, Length
      - name: Self-contained check (extracted zip, outside MSYS2)
        shell: pwsh
        run: |
          $x = Join-Path $env:RUNNER_TEMP extract
          Expand-Archive lobster-qemu-windows-x86_64.zip -DestinationPath $x
          $d = Join-Path $x lobster-qemu-windows-x86_64
          Write-Host "DLLs bundled:"; (Get-ChildItem "$d\bin\*.dll").Count
          # Git-for-Windows bash, not the MSYS2 mingw tree: msys64 is not on PATH here
          $env:PATH = "$d\bin;C:\Windows\System32;C:\Windows;C:\Program Files\Git\bin;C:\Program Files\Git\usr\bin"
          & "C:\Program Files\Git\bin\bash.exe" .github/scripts/smoke.sh ("$d/bin" -replace "\\","/") ("$env:RUNNER_TEMP/smoke-pkg" -replace "\\","/")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-windows-x86_64
          path: |
            ${{ runner.temp }}/smoke-*/serial.log
            ${{ runner.temp }}/smoke-*/qemu.stderr
      - uses: actions/upload-artifact@v4
        with:
          name: lobster-qemu-windows-x86_64
          path: lobster-qemu-windows-x86_64.zip
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    # Only lobster/main pushes (rolling pre-release) and lobster-v* tags
    # (normal release). ci/** pushes produce workflow artifacts only.
    # Validated by a temporary [publish-test] condition on ci/** (run
    # 44356212998 created a pre-release with 4 archives + SHA256SUMS),
    # since removed together with that release.
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/lobster/main' ||
        startsWith(github.ref, 'refs/tags/lobster-v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lobster-qemu-*
          path: archives
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/lobster/main ]; then
            .github/scripts/publish.sh qemu-nightly rolling archives
          else
            .github/scripts/publish.sh "$GITHUB_REF_NAME" release archives
          fi
